name: Update progress badge

on:
  push:
    branches: [master, main]
    paths:
      - 'month-*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compute progress badge
        run: python scripts/progress.py --badge .github/badges/progress.json

      - name: Commit badge if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/progress.json
          git diff --staged --quiet || git commit -m "Update progress badge [skip ci]"
          git push
